      <h1>示例：子目录里的一篇文章</h1>
      <time class="date">2026-11-16</time>
    </header>

    <div class="body">
      <p>这是一个占位示例，用于验证三件事：</p>
      <ul>
        <li>文章可以放在任意深度的子文件夹里；</li>
        <li>目录页里，子文件夹和文章以相同形式、同级展示；</li>
        <li>点开标签页的「思考感悟」，这篇藏在子目录里的文章会和顶层文章一起出现。</li>
      </ul>
      <p>确认效果后，可以把整个 <code>dev/demo/</code> 目录连同数据文件里对应的节点一起删除。</p>
