<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="人生之路与开发之路如阴阳双鱼盘旋交错，你中有我，我中有你">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .spin { transform-origin: 110px 110px; animation: cp-spin 26s linear infinite; }
      @keyframes cp-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
  </defs>

  <!-- 白鱼（人生之路）为底 -->
  <g class="spin" filter="url(#sh)">
    <circle cx="110" cy="110" r="100" fill="#f7f7f5"/>
    <!-- 黑鱼（开发之路）：右大圆 + 下半左凸 + 上半右凸，形成 S 形咬合 -->
    <path d="M110 10 A100 100 0 0 1 110 210 A50 50 0 0 1 110 110 A50 50 0 0 0 110 10 Z" fill="#1c1c1c"/>
    <!-- 鱼眼：各含对方一色，你中有我、我中有你 -->
    <circle cx="110" cy="60" r="17" fill="#1c1c1c"/>
    <circle cx="110" cy="160" r="17" fill="#f7f7f5"/>
  </g>

  <circle cx="110" cy="110" r="100" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
